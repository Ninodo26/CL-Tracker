name: Update standings

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch and compute standings
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python scripts/fetch_and_compute.py

      - name: Commit updated data
        run: |
          git config user.name "cl-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/standings.json
          git diff --cached --quiet && echo "No changes" || git commit -m "Update standings [automated]"
          git push
