name: Update standings

on:
  schedule:
    # Every 3 hours. football-data.org's free tier is 10 requests/minute,
    # not a daily cap — this script makes about 8 calls per run (1 for CL
    # fixtures, up to 7 for domestic league standings), comfortably under
    # the limit even run back-to-back.
    # enormous headroom even if you tighten this a lot.
    - cron: "0 */3 * * *"
  workflow_dispatch: {}   # lets you trigger a manual run from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch and compute standings
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
        run: python scripts/fetch_and_compute.py

      - name: Commit updated data
        run: |
          git config user.name "cl-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/standings.json
          git diff --cached --quiet && echo "No changes" || git commit -m "Update standings [automated]"
          git push
