name: Update standings

on:
  schedule:
    # Every 3 hours. football-data.org's free tier is 10 requests/minute,
    # not a daily cap — 15 football-data.org calls per run, with a 6.5-second
    # delay. Optional API-Football calls are disabled unless ENABLE_API_FOOTBALL=true.
    - cron: "0 */3 * * *"
  workflow_dispatch: {}   # lets you trigger a manual run from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch and compute standings
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          ENABLE_API_FOOTBALL: ${{ vars.ENABLE_API_FOOTBALL }}
          API_FOOTBALL_KEY: ${{ vars.ENABLE_API_FOOTBALL == 'true' && secrets.API_FOOTBALL_KEY || '' }}
        run: python scripts/fetch_and_compute.py

      - name: Commit updated data
        run: |
          git config user.name "cl-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/standings.json
          git diff --cached --quiet && echo "No changes" || git commit -m "Update standings [automated]"
          git push
